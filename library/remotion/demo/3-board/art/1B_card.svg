<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs><filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="12"/></filter></defs>
  <g id="Background/Fill"><rect width="1920" height="1080" fill="#F7F7F5"/></g>
  <g id="Card/Box">
    <rect x="580" y="338" width="760" height="420" rx="24" fill="#222222" opacity="0.08" filter="url(#soft)"/>
    <rect x="580" y="330" width="760" height="420" rx="24" fill="#FFFFFF"/>
  </g>
  <g id="Card/Kicker"><text x="640" y="410" font-family="Manrope" font-weight="700" font-size="23" letter-spacing="3" fill="#6A6A6A">COMMA CLINICAL</text></g>
  <g id="Card/Heading"><text x="640" y="490" font-family="Manrope" font-weight="600" font-size="56" fill="#222222">Snap and settle</text></g>
