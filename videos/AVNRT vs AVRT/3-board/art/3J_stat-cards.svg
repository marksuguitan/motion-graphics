<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.10"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <marker id="arr" viewBox="0 0 12 12" refX="3" refY="6" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#C9861F"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#E6E4E0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6A6A6A" stroke-width="4" opacity="0.5"/></pattern>
</defs>
<rect id="Background" width="1920" height="1080" fill="#F7F7F5"/>
<g id="Header"><text x="120.0" y="132.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#6A6A6A" text-anchor="start" letter-spacing="2.5">AVNRT</text><text x="120.0" y="196.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#222222" text-anchor="start">The most common paroxysmal SVT in adults</text></g><g id="Cards/Stat1"><rect x="120" y="420" width="520" height="300" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><text x="168.0" y="560.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#C9861F" text-anchor="start">50–60%</text><text x="172.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#6A6A6A" text-anchor="start">of SVT cases</text><g id="Cards/Stat2"><rect x="690" y="420" width="520" height="300" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><text x="738.0" y="560.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#222222" text-anchor="start">Young</text><text x="742.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#6A6A6A" text-anchor="start">adults, most often</text><g id="Cards/Stat3"><rect x="1260" y="420" width="520" height="300" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><text x="1308.0" y="560.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" fill="#222222" text-anchor="start">~2 in 3</text><text x="1312.0" y="630.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="500" fill="#6A6A6A" text-anchor="start">patients are women</text>
<g id="BeatID"><text x="1888.0" y="1056.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6A6A6A" text-anchor="end">3J</text></g>
</svg>
