<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.10"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <marker id="arr" viewBox="0 0 12 12" refX="3" refY="6" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#C9861F"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#E6E4E0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6A6A6A" stroke-width="4" opacity="0.5"/></pattern>
</defs>
<rect id="Background" width="1920" height="1080" fill="#F7F7F5"/>
<g id="Cards/Diagram"><rect x="600" y="120" width="720" height="840" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><g id="Diagram"><g id="Diagram/Atria"><rect x="760.0" y="326.0" width="400.0" height="90.0" rx="20.0" fill="#F7F7F5" stroke="#E6E4E0" stroke-width="2"/><text x="784.0" y="380.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#6A6A6A" text-anchor="start">Atria</text></g><g id="Diagram/Channels"><line x1="960" y1="416.0" x2="960" y2="480.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><circle cx="960" cy="600" r="120.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><line x1="960" y1="720.0" x2="960" y2="812.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><path d="M960,812.0 L896.0,863.2 M960,812.0 L1024.0,863.2" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/></g><g id="Diagram/Active"></g><g id="Diagram/AVNode"><ellipse cx="960" cy="724.0" rx="58.0" ry="28.0" fill="#FBEBD0"/><text x="960.0" y="732.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#8A5A10" text-anchor="middle">AV node</text></g><g id="Diagram/Tags"><text x="984.0" y="788.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#6A6A6A" text-anchor="start">His bundle</text><text x="960.0" y="903.2" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#6A6A6A" text-anchor="middle">Ventricles</text></g></g><g id="Cards/Slow"><rect x="120" y="440" width="420" height="220" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><text x="156.0" y="510.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#222222" text-anchor="start">Slow</text><text x="156.0" y="566.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#6A6A6A" text-anchor="start">conducts slowly</text><text x="156.0" y="612.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#6A6A6A" text-anchor="start">recovers quickly</text><g id="Cards/Fast"><rect x="1380" y="440" width="420" height="220" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><text x="1416.0" y="510.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" fill="#222222" text-anchor="start">Fast</text><text x="1416.0" y="566.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#6A6A6A" text-anchor="start">conducts quickly</text><text x="1416.0" y="612.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#6A6A6A" text-anchor="start">recovers slowly</text>
<g id="BeatID"><text x="1888.0" y="1056.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6A6A6A" text-anchor="end">3B</text></g>
