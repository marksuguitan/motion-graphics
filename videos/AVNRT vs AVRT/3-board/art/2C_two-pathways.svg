<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#222222" flood-opacity="0.10"/></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  <filter id="blurU" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="200"/></filter>
  <marker id="arr" viewBox="0 0 12 12" refX="3" refY="6" markerUnits="userSpaceOnUse" markerWidth="30" markerHeight="30" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11 Z" fill="#C9861F"/></marker>
  <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="12" height="12" fill="#E6E4E0"/><line x1="0" y1="0" x2="0" y2="12" stroke="#6A6A6A" stroke-width="4" opacity="0.5"/></pattern>
</defs>
<rect id="Background" width="1920" height="1080" fill="#F7F7F5"/>
<g id="Cards/Diagram"><rect x="120" y="120" width="840" height="840" rx="24" fill="#FFFFFF" filter="url(#soft)"/></g><g id="Diagram"><g id="Diagram/Atria"><rect x="340.0" y="326.0" width="400.0" height="90.0" rx="20.0" fill="#F7F7F5" stroke="#E6E4E0" stroke-width="2"/></g><g id="Diagram/Channels"><line x1="540" y1="416.0" x2="540" y2="480.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><circle cx="540" cy="600" r="120.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><line x1="540" y1="720.0" x2="540" y2="812.0" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/><path d="M540,812.0 L476.0,863.2 M540,812.0 L604.0,863.2" stroke="#E6E4E0" stroke-width="28.0" fill="none" stroke-linecap="round"/></g><g id="Diagram/Active"></g><g id="Diagram/PathLabels"><text x="390.0" y="609.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#222222" text-anchor="end">Slow</text><text x="690.0" y="609.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#222222" text-anchor="start">Fast</text></g></g><g id="Eyebrow"><text x="1060.0" y="360.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#6A6A6A" text-anchor="start" letter-spacing="2.5">WHAT A LOOP NEEDS</text></g><g id="Header"><text x="1060.0" y="442.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#222222" text-anchor="start">Two pathways,</text><text x="1060.0" y="506.0" font-family="Manrope, Inter, Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#222222" text-anchor="start">joined at both ends</text></g>
<g id="BeatID"><text x="1888.0" y="1056.0" font-family="Inter, Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#6A6A6A" text-anchor="end">2C</text></g>
</svg>
